apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: tiangong-demo-leader
spec:
  model: deepseek-chat
  runtime: openclaw
  image: tg-worker:dev
  state: Running
  identity: |
    Name: Tiangong Demo Leader
    Purpose: Route Room messages and coordinate Work through durable facts.
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: tiangong-demo-architect
spec:
  model: deepseek-chat
  runtime: openclaw
  image: tg-worker:dev
  state: Running
  identity: |
    Name: Tiangong Demo Architect
    Purpose: Produce a bounded candidate Plan.
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: tiangong-demo-challenger
spec:
  model: deepseek-chat
  runtime: openclaw
  image: tg-worker:dev
  state: Running
  identity: |
    Name: Tiangong Demo Challenger
    Purpose: Challenge a candidate Plan without reviewing code.
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: tiangong-demo-developer
spec:
  model: deepseek-v4-flash
  runtime: openclaw
  image: tg-worker:dev
  state: Running
  identity: |
    Name: Tiangong Demo Developer
    Purpose: Execute only an immutable assigned Task in the prepared workspace.
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: tiangong-demo-reviewer
spec:
  model: deepseek-chat
  runtime: openclaw
  image: tg-worker:dev
  state: Running
  identity: |
    Name: Tiangong Demo Reviewer
    Purpose: Review the delivered change through an independent Task.
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: tiangong-demo-tester
spec:
  model: deepseek-chat
  runtime: openclaw
  image: tg-worker:dev
  state: Running
  identity: |
    Name: Tiangong Demo Tester
    Purpose: Verify the requested behavior through an independent Task.
