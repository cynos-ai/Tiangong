name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-shell:
    name: Repository and Shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check repository policy
        run: ./scripts/check-repository.sh
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Shell syntax and diagnostics
        run: |
          shell_scripts=(scripts/*.sh smoke-testing/support/*.sh worker/bin/*)
          for script in "${shell_scripts[@]}"; do bash -n "${script}"; done
          shellcheck "${shell_scripts[@]}"
      - name: Test AgentTeams bootstrap
        run: ./scripts/test-agentteams.sh
      - name: Test Team runtime smoke contract
        run: make test-team-runtime-smoke-contract
      - name: Validate project Agent Skills
        run: |
          node --check scripts/check-skills.mjs
          make check-skills
      - name: Install and run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "/tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint

  worker-package:
    name: Worker package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install locked Worker dependencies
        run: |
          npm ci --prefix worker --omit=dev --ignore-scripts --no-audit --no-fund
          npm run --prefix worker patch-dependencies
      - name: Test Worker runtime
        run: |
          test "$(worker/node_modules/.bin/pi --version)" = "0.82.0"
          while IFS= read -r module; do node --check "${module}"; done < <(
            find worker/agent worker/plugin -type f -name '*.mjs' -print | sort
          )
          npm test --prefix worker
      - name: Audit production dependencies
        run: |
          set +e
          npm audit --prefix worker --omit=dev --json > /tmp/worker-audit.json
          audit_status=$?
          set -e
          if [[ "${audit_status}" -eq 0 ]]; then
            exit 0
          fi
          # pi 0.82.0's published shrinkwrap records brace-expansion 5.0.7.
          # patch-dependencies removes that nested copy and verifies runtime
          # resolution to the directly locked 5.0.8 security fix.
          jq -e '
            .metadata.vulnerabilities.total == 1 and
            (.vulnerabilities | keys) == ["brace-expansion"] and
            .vulnerabilities["brace-expansion"].via[0].url ==
              "https://github.com/advisories/GHSA-mh99-v99m-4gvg"
          ' /tmp/worker-audit.json >/dev/null
          test ! -e worker/node_modules/@earendil-works/pi-coding-agent/node_modules/brace-expansion
      - name: Build Worker image
        run: ./scripts/build-worker-image.sh

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "${BASE_SHA}" "${HEAD_SHA}"
