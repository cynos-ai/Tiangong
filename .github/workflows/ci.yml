name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-shell:
    name: Repository and Shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check repository policy
        run: ./scripts/check-repository.sh
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Shell syntax and diagnostics
        run: |
          shell_scripts=(scripts/*.sh smoke-testing/support/*.sh worker/bin/*)
          for script in "${shell_scripts[@]}"; do bash -n "${script}"; done
          shellcheck "${shell_scripts[@]}"
      - name: Set up Node.js for contract checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install locked Worker dependencies for contract checks
        run: npm ci --prefix worker --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Test AgentTeams bootstrap
        run: ./scripts/test-agentteams.sh
      - name: Test Worker peer mention smoke contract
        run: make test-peer-mention-smoke-contract
      - name: Test paused Worker liveness boundary
        run: make test-pause-worker-boundary
      - name: Validate project Agent Skills and demo contract
        run: |
          node --check scripts/check-skills.mjs
          node --check scripts/check-demo-contract.mjs
          make check-skills
          make check-demo-contract
          make test-agentloop-contract
      - name: Install and run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "/tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint

  worker-package:
    name: Worker package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            app/package-lock.json
      - name: Install locked runtime dependencies
        run: |
          npm ci --prefix worker --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm ci --prefix app --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Test Worker and PostgreSQL-authority contracts
        run: |
          test ! -e worker/node_modules/@earendil-works/pi-coding-agent
          while IFS= read -r module; do node --check "${module}"; done < <(
            find worker/agent worker/plugin -type f -name '*.mjs' -print | sort
          )
          npm test --prefix worker
          npm test --prefix app
      - name: Audit production dependency locks
        run: node worker/scripts/audit-lockfile.mjs worker/package-lock.json worker/agentloop-package-lock.json
      - name: Build Worker image
        run: ./scripts/build-worker-image.sh
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          dco_base="${BASE_SHA}"
          dco_excluded=()
          if [[ "${BASE_REF}" == "main" && "${HEAD_REF}" == release/* ]]; then
            develop_sha="$(git rev-parse origin/develop)"
            git merge-base --is-ancestor "${develop_sha}" "${HEAD_SHA}" || {
              printf 'ERROR: release branch does not contain current develop.\n' >&2
              exit 1
            }
            dco_base="${develop_sha}"
            # The release branch records main ancestry to make the divergent
            # v0.1.0 history mergeable. Main's old commits are already covered
            # by the pull-request base and must not be rechecked against the
            # current author identity.
            dco_excluded+=("${BASE_SHA}")
          fi
          ./scripts/check-dco.sh "${dco_base}" "${HEAD_SHA}" "${dco_excluded[@]}"
