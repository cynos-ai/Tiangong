name: secret-scan

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: "8.27.2"
          GITLEAKS_SHA256: 141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history for secrets
        run: |
          set -euo pipefail
          # .gitleaks.toml is optional; the built-in default ruleset is used when absent.
          gitleaks git --redact --verbose --no-banner .
