<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tiangong Runtime Console</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1020; color: #e8ecf4; }
      body { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
      .card { border: 1px solid #2d3852; border-radius: 12px; padding: 20px; background: #121a2d; }
      .work { margin-top: 16px; padding-top: 16px; border-top: 1px solid #2d3852; }
      .muted { color: #9da9bf; }
      code { color: #a9d4ff; }
    </style>
  </head>
  <body>
    <h1>Tiangong Runtime Console</h1>
    <p class="muted">A read-only witness over direct runtime facts. Unknown is a valid state.</p>
    <section class="card" aria-live="polite">
      <h2 id="status">Loading runtime facts…</h2>
      <p id="tool-summary" class="muted">ToolResult observations: unknown</p>
      <div id="works" class="muted">Work projection: unknown</div>
      <pre id="facts">{}</pre>
    </section>
    <script>
      function render(facts) {
        document.querySelector('#status').textContent = facts.status === 'observed' ? 'Runtime facts observed' : 'Runtime facts unavailable';
        const toolResults = Array.isArray(facts.toolResults) ? facts.toolResults : [];
        document.querySelector('#tool-summary').textContent = facts.toolResultsSource === 'tool-result-capture-file'
          ? `Bounded ToolResult observations: ${toolResults.length}`
          : 'ToolResult observations: unknown';
        const works = Array.isArray(facts.works) ? facts.works : [];
        const workContainer = document.querySelector('#works');
        workContainer.replaceChildren();
        workContainer.textContent = facts.workSource === 'coordination-store'
          ? `Work projection: ${works.length} Work(s), ${Array.isArray(facts.deliveries) ? facts.deliveries.length : 0} durable wake(s), ${Array.isArray(facts.decisions) ? facts.decisions.length : 0} decision(s)`
          : 'Work projection: unknown';
        for (const work of works) {
          const card = document.createElement('article');
          card.className = 'work';
          const heading = document.createElement('h3');
          heading.textContent = `${work.workId} · ${work.status} · epoch ${work.epoch}`;
          const summary = document.createElement('p');
          summary.textContent = work.currentWorkSpec?.objective ?? 'Objective unavailable';
          const timeline = document.createElement('p');
          timeline.className = 'muted';
          const deliveries = (Array.isArray(facts.deliveries) ? facts.deliveries : [])
            .filter((delivery) => delivery.workId === work.workId)
            .map((delivery) => `${delivery.kind}:${delivery.status}`)
            .join(', ');
          const decisions = (Array.isArray(facts.decisions) ? facts.decisions : [])
            .filter((decision) => decision.workId === work.workId)
            .map((decision) => `${decision.decision}${decision.taskId ? `:${decision.taskId}` : ''}`)
            .join(', ');
          timeline.textContent = `Leader session ${work.leaderSessionId}; timeline ${Array.isArray(work.timeline) ? work.timeline.length : 0}; wakes ${deliveries || 'none'}; decisions ${decisions || 'none'}.`;
          card.append(heading, summary, timeline);
          workContainer.append(card);
        }
        document.querySelector('#facts').textContent = JSON.stringify(facts, null, 2);
      }
      function fallback() {
        fetch('/api/runtime', { cache: 'no-store' }).then((response) => response.json()).then(render)
          .catch(() => { document.querySelector('#status').textContent = 'Runtime facts unavailable'; });
      }
      if (typeof EventSource === 'function') {
        const stream = new EventSource('/api/runtime/events');
        stream.addEventListener('runtime', (event) => {
          try { render(JSON.parse(event.data)); } catch { fallback(); }
        });
        stream.onerror = () => { stream.close(); fallback(); };
      } else {
        fallback();
      }
    </script>
  </body>
</html>
